name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your Notion token** or other secrets in an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Tray menu → About
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple silicon), macOS (Intel), Linux (AppImage), Linux (.deb)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        Logs: Windows `%APPDATA%\Notion Quick Capture\logs\main.log`,
        macOS `~/Library/Logs/Notion Quick Capture/main.log`,
        Linux `~/.config/Notion Quick Capture/logs/main.log`. Remove anything private first.
      render: text
